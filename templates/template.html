<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{{CITY_NAME}} | Theocharis Travel Experience</title>

    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>

  <body>
    <header class="city-hero">
      <img
        src="../images/cities/{{CITY_SLUG}}/optimized/{{CITY_SLUG}}-cover.jpeg"
        alt="{{CITY_NAME}} travel photography"
      />

      <div class="city-hero-content">
        <nav class="breadcrumbs">
          <a href="../index.html">Countries</a>
          <span>›</span>
          <a href="../countries/{{COUNTRY_SLUG}}.html">{{COUNTRY_NAME}}</a>
          <span>›</span>
          <span>{{CITY_NAME}}</span>
        </nav>

        <p class="eyebrow">{{COUNTRY_NAME}}</p>
        <h1>{{CITY_NAME}}</h1>
        <p>{{CITY_DESCRIPTION}}</p>

        <button class="btn" id="openViewerBtn">View Photos</button>
      </div>
    </header>

    <main class="container">
      <section class="story">
        <h2>About {{CITY_NAME}}</h2>
        <p>{{CITY_STORY}}</p>
      </section>

      <section class="gallery-grid city-gallery">
        <!-- GENERATED GALLERY -->
      </section>
    </main>

    <div class="photo-viewer" id="photoViewer">
      <button class="viewer-close" id="viewerClose">×</button>
      <button class="viewer-arrow viewer-prev" id="viewerPrev">‹</button>

      <figure class="viewer-frame">
        <img id="viewerImage" src="" alt="" />
        <figcaption>
          <h3 id="viewerTitle"></h3>
          <p id="viewerText"></p>
        </figcaption>
      </figure>

      <button class="viewer-arrow viewer-next" id="viewerNext">›</button>
    </div>

    <script src="../script.js"></script>
  </body>
</html>
